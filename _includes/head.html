<head>
  <title>
    {% if page.title == "Home" %}
      {{ site.title }} | {{ site.description }}
    {% else %}
      {{ page.title }} | {{ site.title }}
    {% endif %}
  </title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/syntax.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/font-awesome.min.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/academicons.min.css">
  <!-- Preload key fonts to avoid text reflow (FOUT) on first paint -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ site.baseurl }}/assets/fonts/pt-serif-regular-400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ site.baseurl }}/assets/fonts/quattrocento-sans-regular-400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ site.baseurl }}/assets/fonts/fontawesome-webfont.woff2">
  <link rel="preload" as="font" type="font/woff" crossorigin href="{{ site.baseurl }}/assets/fonts/academicons.woff">
  <!-- Use Jekyll SEO plugin -->
  {% seo %}
</head>
